<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users - BRSR Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: linear-gradient(135deg, #1a1a2e, #0f3460); padding: 15px 30px; }
        .navbar-brand { color: white !important; font-size: 1.4rem; font-weight: 700; }
        .admin-badge { background: #c8102e; color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; margin-left: 8px; }
        .page-header { background: white; padding: 20px 30px; border-bottom: 3px solid #1a1a2e; margin-bottom: 30px; }
        .table-card { background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); overflow: hidden; }
        .table thead { background: linear-gradient(135deg, #1a1a2e, #0f3460); color: white; }
        .table thead th { border: none; padding: 15px; font-weight: 600; }
        .table tbody td { padding: 12px 15px; vertical-align: middle; }
        .table tbody tr:hover { background: #f8f9fa; }
        .badge-admin { background: #c8102e; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; }
        .badge-user { background: #3498db; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; }
        .badge-active { background: #27ae60; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; }
        .badge-inactive { background: #e74c3c; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; }
        .btn-sm-action { padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; border: none; color: white; text-decoration: none; display: inline-block; margin: 2px; }
        .btn-view-reports { background: #3498db; }
        .btn-make-admin { background: #c8102e; }
        .btn-make-user { background: #27ae60; }
        .btn-deactivate { background: #e74c3c; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container-fluid">
        <span class="navbar-brand">
            <i class="fas fa-shield-alt me-2"></i>
            BRSR Admin Panel
            <span class="admin-badge">ADMIN</span>
        </span>
        <div class="d-flex align-items-center gap-3">
            <a href="/admin" class="text-white text-decoration-none">
                <i class="fas fa-tachometer-alt me-1"></i>Admin Dashboard
            </a>
            <a href="/logout" class="btn btn-outline-light btn-sm">
                <i class="fas fa-sign-out-alt me-1"></i>Logout
            </a>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="container-fluid">
        <a href="/admin" style="color:#1a1a2e; text-decoration:none; font-weight:600;">
            <i class="fas fa-arrow-left me-1"></i>Back to Admin
        </a>
        <h4 class="mt-1" style="color:#1a1a2e; font-weight:700; margin:0;">
            <i class="fas fa-users me-2" style="color:#c8102e;"></i>
            Manage Users
        </h4>
    </div>
</div>

<div class="container-fluid px-4">

    <div th:if="${successMsg}"
         class="alert alert-success alert-dismissible fade show">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close"
                data-bs-dismiss="alert"></button>
    </div>

    <div class="table-card">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th>#</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Department</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user, i : ${users}">
                <td th:text="${i.count}"></td>
                <td>
                    <i class="fas fa-user-circle me-2"
                       style="color:#c8102e;"></i>
                    <strong th:text="${user.fullName}"></strong>
                </td>
                <td th:text="${user.email}"></td>
                <td>
                        <span th:if="${user.role == 'ADMIN'}"
                              class="badge-admin">
                            <i class="fas fa-shield-alt me-1"></i>ADMIN
                        </span>
                    <span th:unless="${user.role == 'ADMIN'}"
                          class="badge-user">
                            <i class="fas fa-user me-1"></i>USER
                        </span>
                </td>
                <td>
                        <span th:if="${user.isActive}"
                              class="badge-active">Active</span>
                    <span th:unless="${user.isActive}"
                          class="badge-inactive">Inactive</span>
                </td>
                <td th:text="${user.departmentId != null ? 'Dept #' + user.departmentId : 'Not Assigned'}"></td>
                <td>
                    <a th:href="@{/admin/users/{id}/reports(id=${user.id})}"
                       class="btn-sm-action btn-view-reports">
                        <i class="fas fa-file-alt"></i> Reports
                    </a>
                    <a th:if="${user.role != 'ADMIN'}"
                       th:href="@{/admin/users/{id}/make-admin(id=${user.id})}"
                       class="btn-sm-action btn-make-admin"
                       onclick="return confirm('Make this user an Admin?')">
                        <i class="fas fa-shield-alt"></i> Make Admin
                    </a>
                    <a th:if="${user.role == 'ADMIN'}"
                       th:href="@{/admin/users/{id}/make-user(id=${user.id})}"
                       class="btn-sm-action btn-make-user"
                       onclick="return confirm('Remove Admin role?')">
                        <i class="fas fa-user"></i> Make User
                    </a>
                    <a th:if="${user.isActive}"
                       th:href="@{/admin/users/{id}/deactivate(id=${user.id})}"
                       class="btn-sm-action btn-deactivate"
                       onclick="return confirm('Deactivate this user?')">
                        <i class="fas fa-ban"></i> Deactivate
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="7" class="text-center py-4 text-muted">
                    <i class="fas fa-users fa-2x mb-2 d-block"></i>
                    No users found.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
