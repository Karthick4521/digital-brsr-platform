<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Review Report - BRSR Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: linear-gradient(135deg, #c8102e, #8b0000); padding: 15px 30px; }
        .navbar-brand { color: white !important; font-size: 1.4rem; font-weight: 700; }
        .page-header { background: white; padding: 20px 30px; border-bottom: 3px solid #c8102e; margin-bottom: 30px; }
        .review-card { background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); padding: 30px; margin-bottom: 25px; }
        .section-title { color: white; font-weight: 700; padding: 12px 20px; border-radius: 10px; margin-bottom: 20px; }
        .info { background: linear-gradient(135deg, #c8102e, #8b0000); }
        .approve-section { background: linear-gradient(135deg, #27ae60, #229954); }
        .reject-section { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .history-section { background: linear-gradient(135deg, #1a1a2e, #0f3460); }
        .data-label { font-weight: 600; color: #6c757d; font-size: 0.85rem; text-transform: uppercase; }
        .data-value { font-size: 1rem; font-weight: 600; color: #1a1a2e; margin-top: 5px; }
        .status-submitted { background: #f39c12; color: white; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; }
        .status-approved { background: #27ae60; color: white; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; }
        .status-rejected { background: #e74c3c; color: white; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; }
        .form-control { border: 2px solid #e9ecef; border-radius: 8px; padding: 10px 15px; }
        .form-control:focus { border-color: #c8102e; box-shadow: 0 0 0 3px rgba(200,16,46,0.15); }
        .btn-approve { background: linear-gradient(135deg, #27ae60, #229954); color: white; border: none; padding: 12px 30px; border-radius: 10px; font-weight: 700; font-size: 1rem; }
        .btn-approve:hover { color: white; opacity: 0.9; }
        .btn-reject { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; border: none; padding: 12px 30px; border-radius: 10px; font-weight: 700; font-size: 1rem; }
        .btn-reject:hover { color: white; opacity: 0.9; }
        .history-badge-approved { background: #27ae60; color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; }
        .history-badge-rejected { background: #e74c3c; color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container-fluid">
        <span class="navbar-brand"><i class="fas fa-envelope me-2"></i>India Post - BRSR Platform</span>
        <div class="d-flex align-items-center gap-3">
            <a href="/dashboard" class="text-white text-decoration-none"><i class="fas fa-home me-1"></i>Dashboard</a>
            <a href="/logout" class="btn btn-outline-light btn-sm"><i class="fas fa-sign-out-alt me-1"></i>Logout</a>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="container-fluid">
        <a href="/approvals" style="color:#c8102e; text-decoration:none; font-weight:600;">
            <i class="fas fa-arrow-left me-1"></i>Back to Approvals
        </a>
        <h4 class="mt-1" style="color:#1a1a2e; font-weight:700;">
            <i class="fas fa-clipboard-check me-2" style="color:#c8102e;"></i>
            Review Report
        </h4>
    </div>
</div>

<div class="container-fluid px-4">

    <!-- Report Info -->
    <div class="review-card">
        <div class="section-title info">
            <i class="fas fa-info-circle me-2"></i>Report Information
        </div>
        <div class="row">
            <div class="col-md-3 mb-3">
                <div class="data-label">Report ID</div>
                <div class="data-value" th:text="'#' + ${report.id}"></div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="data-label">Financial Year</div>
                <div class="data-value" th:text="${report.financialYear}"></div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="data-label">Department ID</div>
                <div class="data-value" th:text="${report.departmentId}"></div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="data-label">Current Status</div>
                <div class="mt-1">
                    <span th:class="${'status-' + #strings.toLowerCase(report.status)}"
                          th:text="${report.status}"></span>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="data-label">Submitted Date</div>
                <div class="data-value"
                     th:text="${#temporals.format(report.createdAt, 'dd-MM-yyyy')}"></div>
            </div>
        </div>
    </div>

    <!-- Approve Section -->
    <div class="review-card" th:if="${report.status == 'SUBMITTED'}">
        <div class="section-title approve-section">
            <i class="fas fa-check-circle me-2"></i>Approve Report
        </div>
        <form th:action="@{/approvals/approve/{id}(id=${report.id})}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">Approval Comments</label>
                <textarea name="comments" class="form-control" rows="3"
                          placeholder="Enter approval comments..."></textarea>
            </div>
            <button type="submit" class="btn-approve"
                    onclick="return confirm('Approve this report?')">
                <i class="fas fa-check me-2"></i>Approve Report
            </button>
        </form>
    </div>

    <!-- Reject Section -->
    <div class="review-card" th:if="${report.status == 'SUBMITTED'}">
        <div class="section-title reject-section">
            <i class="fas fa-times-circle me-2"></i>Reject Report
        </div>
        <form th:action="@{/approvals/reject/{id}(id=${report.id})}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">Rejection Reason <span class="text-danger">*</span></label>
                <textarea name="comments" class="form-control" rows="3"
                          placeholder="Enter reason for rejection..." required></textarea>
            </div>
            <button type="submit" class="btn-reject"
                    onclick="return confirm('Reject this report?')">
                <i class="fas fa-times me-2"></i>Reject Report
            </button>
        </form>
    </div>

    <!-- Approval History -->
    <div class="review-card">
        <div class="section-title history-section">
            <i class="fas fa-history me-2"></i>Approval History
        </div>
        <div th:if="${#lists.isEmpty(approvals)}" class="text-muted text-center py-3">
            <i class="fas fa-inbox fa-2x mb-2 d-block"></i>
            No approval history yet.
        </div>
        <div th:each="approval : ${approvals}" class="border-bottom pb-3 mb-3">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <span th:if="${approval.action == 'APPROVED'}"
                          class="history-badge-approved">
                        <i class="fas fa-check me-1"></i>APPROVED
                    </span>
                    <span th:if="${approval.action == 'REJECTED'}"
                          class="history-badge-rejected">
                        <i class="fas fa-times me-1"></i>REJECTED
                    </span>
                    <span class="ms-2 text-muted" style="font-size:0.85rem;"
                          th:text="${#temporals.format(approval.reviewedAt, 'dd-MM-yyyy HH:mm')}">
                    </span>
                </div>
                <small class="text-muted"
                       th:text="'Reviewed by User #' + ${approval.reviewedBy}">
                </small>
            </div>
            <div class="mt-2 text-muted" th:text="${approval.comments}"></div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
