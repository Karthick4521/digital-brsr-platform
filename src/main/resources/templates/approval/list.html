<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Approvals - BRSR Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: linear-gradient(135deg, #c8102e, #8b0000); padding: 15px 30px; }
        .navbar-brand { color: white !important; font-size: 1.4rem; font-weight: 700; }
        .page-header { background: white; padding: 20px 30px; border-bottom: 3px solid #c8102e; margin-bottom: 30px; }
        .table-card { background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 30px; }
        .table thead { background: linear-gradient(135deg, #1a1a2e, #0f3460); color: white; }
        .table thead th { border: none; padding: 15px; font-weight: 600; }
        .table tbody td { padding: 12px 15px; vertical-align: middle; }
        .table tbody tr:hover { background: #fff5f5; }
        .status-draft { background: #95a5a6; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; }
        .status-submitted { background: #f39c12; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; }
        .status-approved { background: #27ae60; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; }
        .status-rejected { background: #e74c3c; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; }
        .btn-submit { background: #f39c12; color: white; border: none; padding: 5px 12px; border-radius: 6px; font-size: 0.8rem; text-decoration: none; }
        .btn-review { background: #3498db; color: white; border: none; padding: 5px 12px; border-radius: 6px; font-size: 0.8rem; text-decoration: none; }
        .btn-submit:hover { background: #d68910; color: white; }
        .btn-review:hover { background: #2980b9; color: white; }
        .section-heading { font-weight: 700; color: #1a1a2e; margin-bottom: 15px; padding-left: 5px; border-left: 4px solid #c8102e; padding-left: 12px; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container-fluid">
        <span class="navbar-brand"><i class="fas fa-envelope me-2"></i>India Post - BRSR Platform</span>
        <div class="d-flex align-items-center gap-3">
            <a href="/dashboard" class="text-white text-decoration-none"><i class="fas fa-home me-1"></i>Dashboard</a>
            <a href="/logout" class="btn btn-outline-light btn-sm"><i class="fas fa-sign-out-alt me-1"></i>Logout</a>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="container-fluid">
        <a href="/dashboard" style="color:#c8102e; text-decoration:none; font-weight:600;">
            <i class="fas fa-arrow-left me-1"></i>Back
        </a>
        <h4 class="mt-1" style="color:#1a1a2e; font-weight:700; margin:0;">
            <i class="fas fa-check-double me-2" style="color:#c8102e;"></i>
            Approval Workflow
        </h4>
    </div>
</div>

<div class="container-fluid px-4">

    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Reports Table -->
    <h5 class="section-heading">All Reports</h5>
    <div class="table-card">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th>#</th>
                <th>Report ID</th>
                <th>Financial Year</th>
                <th>Department ID</th>
                <th>Status</th>
                <th>Created Date</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="report, i : ${reports}">
                <td th:text="${i.count}"></td>
                <td th:text="'#' + ${report.id}"></td>
                <td><strong th:text="${report.financialYear}"></strong></td>
                <td th:text="${report.departmentId}"></td>
                <td>
                        <span th:class="${'status-' + #strings.toLowerCase(report.status)}"
                              th:text="${report.status}"></span>
                </td>
                <td th:text="${#temporals.format(report.createdAt, 'dd-MM-yyyy')}"></td>
                <td>
                    <a th:if="${report.status == 'DRAFT'}"
                       th:href="@{/approvals/submit/{id}(id=${report.id})}"
                       class="btn-submit me-1"
                       onclick="return confirm('Submit this report for approval?')">
                        <i class="fas fa-paper-plane"></i> Submit
                    </a>
                    <a th:if="${report.status == 'SUBMITTED'}"
                       th:href="@{/approvals/review/{id}(id=${report.id})}"
                       class="btn-review">
                        <i class="fas fa-eye"></i> Review
                    </a>
                    <span th:if="${report.status == 'APPROVED'}"
                          style="color:#27ae60; font-weight:600;">
                            <i class="fas fa-check-circle"></i> Approved
                        </span>
                    <span th:if="${report.status == 'REJECTED'}"
                          style="color:#e74c3c; font-weight:600;">
                            <i class="fas fa-times-circle"></i> Rejected
                        </span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(reports)}">
                <td colspan="7" class="text-center py-4 text-muted">
                    <i class="fas fa-inbox fa-2x mb-2 d-block"></i>
                    No reports found.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
