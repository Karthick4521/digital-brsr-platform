<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Department Form - BRSR Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: linear-gradient(135deg, #c8102e, #8b0000); padding: 15px 30px; }
        .navbar-brand { color: white !important; font-size: 1.4rem; font-weight: 700; }
        .page-header {
            background: white;
            padding: 20px 30px;
            border-bottom: 3px solid #c8102e;
            margin-bottom: 30px;
        }
        .form-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            padding: 35px;
            max-width: 100%;
            margin: 0;
        }
        .form-label { font-weight: 600; color: #1a1a2e; }
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 10px 15px;
        }
        .form-control:focus {
            border-color: #c8102e;
            box-shadow: 0 0 0 3px rgba(200,16,46,0.15);
        }
        .btn-save {
            background: linear-gradient(135deg, #c8102e, #8b0000);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
        }
        .btn-save:hover { color: white; opacity: 0.9; }
        .btn-cancel {
            border: 2px solid #6c757d;
            color: #6c757d;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            background: transparent;
            text-decoration: none;
        }
        .btn-cancel:hover { background: #6c757d; color: white; }
        .back-link { color: #c8102e; text-decoration: none; font-weight: 600; }
        .section-title {
            color: #c8102e;
            font-weight: 700;
            border-bottom: 2px solid #c8102e;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="container-fluid">
        <span class="navbar-brand">
            <i class="fas fa-envelope me-2"></i>India Post - BRSR Platform
        </span>
        <div class="d-flex align-items-center gap-3">
            <a href="/dashboard" class="text-white text-decoration-none">
                <i class="fas fa-home me-1"></i>Dashboard
            </a>
            <a href="/logout" class="btn btn-outline-light btn-sm">
                <i class="fas fa-sign-out-alt me-1"></i>Logout
            </a>
        </div>
    </div>
</nav>

<!-- Page Header -->
<div class="page-header">
    <div class="container-fluid">
        <a href="/departments" class="back-link">
            <i class="fas fa-arrow-left me-1"></i>Back to Departments
        </a>
        <h4 class="mt-1" style="color:#1a1a2e; font-weight:700;">
            <i class="fas fa-building me-2" style="color:#c8102e;"></i>
            <span th:if="${department.id == null}">Add New Department</span>
            <span th:unless="${department.id == null}">Edit Department</span>
        </h4>
    </div>
</div>

<div class="container-fluid px-5">
    <div class="form-card">

        <h5 class="section-title">
            <i class="fas fa-info-circle me-2"></i>Department Information
        </h5>

        <!-- Error Messages -->
        <div th:if="${codeError}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${codeError}"></span>
        </div>

        <form th:action="@{/departments/save}"
              th:object="${department}"
              method="post">

            <!-- Hidden ID for edit -->
            <input type="hidden" th:field="*{id}"/>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Department Name <span class="text-danger">*</span>
                    </label>
                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="e.g. Mumbai Circle"/>
                    <small class="text-danger"
                           th:if="${#fields.hasErrors('name')}"
                           th:errors="*{name}"></small>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Department Code <span class="text-danger">*</span>
                    </label>
                    <input type="text"
                           th:field="*{code}"
                           class="form-control"
                           placeholder="e.g. MUM001"/>
                    <small class="text-danger"
                           th:if="${#fields.hasErrors('code')}"
                           th:errors="*{code}"></small>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Location</label>
                    <input type="text"
                           th:field="*{location}"
                           class="form-control"
                           placeholder="e.g. Mumbai, Maharashtra"/>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Head Name</label>
                    <input type="text"
                           th:field="*{headName}"
                           class="form-control"
                           placeholder="e.g. Rajesh Kumar"/>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Status</label>
                <select th:field="*{isActive}" class="form-control">
                    <option value="true">Active</option>
                    <option value="false">Inactive</option>
                </select>
            </div>

            <div class="d-flex gap-3">
                <button type="submit" class="btn-save">
                    <i class="fas fa-save me-2"></i>
                    <span th:if="${department.id == null}">Save Department</span>
                    <span th:unless="${department.id == null}">Update Department</span>
                </button>
                <a href="/departments" class="btn-cancel">
                    <i class="fas fa-times me-2"></i>Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
