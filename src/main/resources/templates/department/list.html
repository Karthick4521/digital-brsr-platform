<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Departments - BRSR Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: linear-gradient(135deg, #c8102e, #8b0000); padding: 15px 30px; }
        .navbar-brand { color: white !important; font-size: 1.4rem; font-weight: 700; }
        .page-header {
            background: white;
            padding: 20px 30px;
            border-bottom: 3px solid #c8102e;
            margin-bottom: 30px;
        }
        .page-title { color: #1a1a2e; font-weight: 700; margin: 0; }
        .btn-add {
            background: linear-gradient(135deg, #c8102e, #8b0000);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
        }
        .btn-add:hover { color: white; opacity: 0.9; }
        .table-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .table thead {
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            color: white;
        }
        .table thead th { border: none; padding: 15px; font-weight: 600; }
        .table tbody td { padding: 12px 15px; vertical-align: middle; }
        .table tbody tr:hover { background: #fff5f5; }
        .badge-active { background: #27ae60; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; }
        .badge-inactive { background: #e74c3c; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; }
        .btn-edit { background: #3498db; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; }
        .btn-edit:hover { background: #2980b9; color: white; }
        .btn-delete:hover { background: #c0392b; color: white; }
        .back-link { color: #c8102e; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="container-fluid">
        <span class="navbar-brand">
            <i class="fas fa-envelope me-2"></i>India Post - BRSR Platform
        </span>
        <div class="d-flex align-items-center gap-3">
            <a href="/dashboard" class="text-white text-decoration-none">
                <i class="fas fa-home me-1"></i>Dashboard
            </a>
            <a href="/logout" class="btn btn-outline-light btn-sm">
                <i class="fas fa-sign-out-alt me-1"></i>Logout
            </a>
        </div>
    </div>
</nav>

<!-- Page Header -->
<div class="page-header">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <div>
            <a href="/dashboard" class="back-link">
                <i class="fas fa-arrow-left me-1"></i>Back
            </a>
            <h4 class="page-title mt-1">
                <i class="fas fa-building me-2" style="color:#c8102e;"></i>
                Department Management
            </h4>
        </div>
        <a href="/departments/add" class="btn-add">
            <i class="fas fa-plus me-2"></i>Add Department
        </a>
    </div>
</div>

<div class="container-fluid px-4">

    <!-- Success Message -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Table -->
    <div class="table-card">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th>#</th>
                <th>Department Name</th>
                <th>Code</th>
                <th>Location</th>
                <th>Head Name</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="dept, i : ${departments}">
                <td th:text="${i.count}"></td>
                <td>
                    <strong th:text="${dept.name}"></strong>
                </td>
                <td>
                        <span class="badge bg-secondary"
                              th:text="${dept.code}"></span>
                </td>
                <td th:text="${dept.location}"></td>
                <td th:text="${dept.headName}"></td>
                <td>
                        <span th:if="${dept.isActive}"
                              class="badge-active">Active</span>
                    <span th:unless="${dept.isActive}"
                          class="badge-inactive">Inactive</span>
                </td>
                <td>
                    <a th:href="@{/departments/edit/{id}(id=${dept.id})}"
                       class="btn-edit me-1">
                        <i class="fas fa-edit"></i> Edit
                    </a>
                    <a th:href="@{/departments/delete/{id}(id=${dept.id})}"
                       class="btn-delete"
                       onclick="return confirm('Delete this department?')">
                        <i class="fas fa-trash"></i> Delete
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(departments)}">
                <td colspan="7" class="text-center py-4 text-muted">
                    <i class="fas fa-inbox fa-2x mb-2 d-block"></i>
                    No departments found. Click "Add Department" to create one.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
