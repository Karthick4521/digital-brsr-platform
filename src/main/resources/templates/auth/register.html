<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRSR Platform - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .register-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
        }

        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, #c8102e 0%, #8b0000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            position: relative;
            overflow: hidden;
        }

        .left-panel::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            top: -100px;
            left: -100px;
        }

        .brand-logo {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1;
        }

        .brand-logo i { font-size: 50px; color: #c8102e; }

        .brand-title {
            color: white;
            font-size: 2.5rem;
            font-weight: 800;
            text-align: center;
            z-index: 1;
        }

        .brand-subtitle {
            color: rgba(255,255,255,0.85);
            font-size: 1rem;
            text-align: center;
            margin-top: 15px;
            z-index: 1;
            line-height: 1.6;
        }

        .right-panel {
            flex: 1;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 50px;
            overflow-y: auto;
        }

        .register-box {
            width: 100%;
            max-width: 450px;
        }

        .register-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .register-desc {
            color: #6c757d;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-label {
            font-weight: 600;
            color: #1a1a2e;
            font-size: 0.9rem;
        }

        .form-control {
            padding: 12px 15px 12px 45px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #c8102e;
            box-shadow: 0 0 0 3px rgba(200,16,46,0.15);
        }

        .input-group { position: relative; }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #c8102e;
            z-index: 5;
        }

        .btn-register {
            background: linear-gradient(135deg, #c8102e, #8b0000);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(200,16,46,0.4);
            color: white;
        }

        .btn-login-link {
            border: 2px solid #c8102e;
            color: #c8102e;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            background: transparent;
            transition: all 0.3s;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-login-link:hover {
            background: #c8102e;
            color: white;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e9ecef;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            color: #6c757d;
            font-size: 0.85rem;
            position: relative;
        }

        .mb-3 { margin-bottom: 18px !important; }

        @media (max-width: 768px) {
            .left-panel { display: none; }
            .right-panel { padding: 30px 20px; }
        }
    </style>
</head>
<body>
<div class="register-wrapper">

    <!-- Left Panel -->
    <div class="left-panel">
        <div class="brand-logo">
            <i class="fas fa-envelope"></i>
        </div>
        <div class="brand-title">India Post</div>
        <div class="brand-subtitle">
            Digital BRSR Platform<br>
            Join us in building a<br>sustainable future
        </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
        <div class="register-box">
            <h2 class="register-title">Create Account</h2>
            <p class="register-desc">Register to access the BRSR platform</p>

            <!-- Error Messages -->
            <div th:if="${emailError}" class="alert alert-danger"
                 th:text="${emailError}"></div>

            <!-- Register Form -->
            <form th:action="@{/register}" th:object="${user}" method="post">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <div class="input-group">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" th:field="*{fullName}"
                               class="form-control"
                               placeholder="Enter your full name"/>
                    </div>
                    <small class="text-danger"
                           th:if="${#fields.hasErrors('fullName')}"
                           th:errors="*{fullName}"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" th:field="*{email}"
                               class="form-control"
                               placeholder="Enter your email"/>
                    </div>
                    <small class="text-danger"
                           th:if="${#fields.hasErrors('email')}"
                           th:errors="*{email}"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" th:field="*{password}"
                               class="form-control"
                               placeholder="Min 6 characters"/>
                    </div>
                    <small class="text-danger"
                           th:if="${#fields.hasErrors('password')}"
                           th:errors="*{password}"></small>
                </div>

                <button type="submit" class="btn-register">
                    <i class="fas fa-user-plus me-2"></i>Create Account
                </button>
            </form>

            <div class="divider"><span>Already have an account?</span></div>

            <a href="/login" class="btn-login-link">
                <i class="fas fa-sign-in-alt me-2"></i>Back to Login
            </a>

            <div class="text-center mt-3">
                <small class="text-muted">
                    © 2024 India Post | Digital BRSR Platform
                </small>
            </div>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
