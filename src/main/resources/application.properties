spring.application.name=digital-brsr-platform

server.port=${PORT:8085}

# Railway MySQL Configuration
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/brsr_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=$root
spring.datasource.password=$Dine@dk
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
file.upload.dir=${UPLOAD_DIR:C:/brsr-uploads}